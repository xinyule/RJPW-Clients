# RJPW 自有 CI：构建浏览器扩展（未签名）。
# 只手动触发；签名与上架在本地/商店侧另行处理，不在此工作流内。
name: Build Browser

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-browser
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Print environment
        run: |
          node --version
          npm --version

      - name: Install dependencies
        # 仓库 engines 要求 npm ~11（Node 24 自带），lock 文件与 npm 11 同步；
        # 用 npm 10 跑 npm ci 会误报 lock 不同步，勿降级 npm。
        run: npm ci

      - name: Build ${{ matrix.browser }} (production, unsigned)
        working-directory: apps/browser
        run: npm run dist:${{ matrix.browser }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rjpw-browser-${{ matrix.browser }}
          path: apps/browser/dist/*.zip
          if-no-files-found: error
