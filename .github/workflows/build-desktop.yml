# RJPW 自有 CI：构建桌面端未签名包（Windows / macOS / Linux）。
# 只手动触发；不注入任何签名证书：macOS 靠 CSC_IDENTITY_AUTO_DISCOVERY=false 跳过签名，
# Windows 只出 NSIS/Portable（appx 需证书，不在未签名 CI 内），publish 一律 never，
# 绝不把包发布到更新地址。正式签名/公证在本地另行处理。
name: Build Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-desktop
  cancel-in-progress: false

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
          - platform: linux
            os: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Print environment
        run: |
          node --version
          npm --version
          rustc --version

      - name: Install dependencies
        # 仓库 engines 要求 npm ~11（Node 24 自带），lock 文件与 npm 11 同步。
        run: npm ci

      - name: Build native modules (Windows / Linux, host target)
        if: matrix.platform != 'macos'
        working-directory: apps/desktop
        run: npm run build-native

      - name: Build native modules (macOS, cross-platform for universal)
        if: matrix.platform == 'macos'
        working-directory: apps/desktop/desktop_native
        run: node build.js cross-platform --release

      - name: Build app (Windows / Linux)
        if: matrix.platform != 'macos'
        working-directory: apps/desktop
        run: npm run build

      - name: Package Windows (unsigned NSIS + Portable, x64)
        if: matrix.platform == 'windows'
        working-directory: apps/desktop
        run: npx electron-builder --win nsis portable --x64 -p never

      - name: Package Linux (unsigned deb / rpm / AppImage, x64)
        if: matrix.platform == 'linux'
        working-directory: apps/desktop
        run: npx electron-builder --linux deb rpm AppImage --x64 -p never

      - name: Build app (macOS)
        if: matrix.platform == 'macos'
        working-directory: apps/desktop
        run: npm run build

      # dist:mac/pack:mac 走 scripts/build-macos-extension.js，它写死了 Developer ID
      # 身份与描述文件（正式签名材料由用户本人提供，未签名 CI 过不了）。这里改用
      # xcodebuild 的 CODE_SIGNING_ALLOWED=NO 直接产未签名 appex，再按该脚本的约定
      # 放到 macos/dist/（after-pack.js 打包时从这里取扩展），其余参数与脚本的
      # stable 渠道保持一致。注意：产物里的扩展未签名，正式分发前仍需签名。
      - name: Build autofill extension (macOS, unsigned)
        if: matrix.platform == 'macos'
        working-directory: apps/desktop
        run: |
          ./desktop_native/autofill_provider/build.sh
          xcodebuild -project ./macos/desktop.xcodeproj -alltargets -configuration ReleaseDeveloper \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            BITWARDEN_APP_ID=com.rjpw.desktop BITWARDEN_PRODUCT_NAME=Bitwarden
          mkdir -p macos/dist
          cp -R macos/build/ReleaseDeveloper/autofill-extension.appex macos/dist/autofill-extension.appex
          rm -rf macos/build

      # electron-builder.json 里 mac.provisioningProfile 指向用户正式签名用的
      # 描述文件（仓库里没有），未签名构建须在命令行覆盖为空——上游自己的
      # pack:local:mac 用的就是这个办法（-c.mac.provisioningProfile=""）。
      # 另须 -c.mac.identity=null 让 electron-builder 彻底不签名：无身份时它会
      # 回退 ad-hoc 签名（--sign -），而包内 autofill-extension.appex 是完全未
      # 签名状态，签外层会报 "code object is not signed at all" 中止。上游自己的
      # pack:mac:mas 也用 identity=null 禁签。此覆盖只作用于本条未签名 CI 命令，
      # 正式签名走的 dist:mac/pack:mac 不受影响。
      # after-sign.js 无条件尝试公证（notarize），未签名包过不了它的签名校验；
      # 该脚本自带开关：APPLE_NOTARIZE=false 即跳过。只在本步设，不影响正式
      # 签名/公证流程（正式构建不经过这条 CI 命令、也不带这个环境变量）。
      - name: Package macOS (unsigned, universal)
        if: matrix.platform == 'macos'
        working-directory: apps/desktop
        env:
          APPLE_NOTARIZE: "false"
        run: npx electron-builder --mac --universal -p never -c.mac.provisioningProfile="" -c.mac.identity=null

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rjpw-desktop-${{ matrix.platform }}
          path: apps/desktop/dist/*
          if-no-files-found: error
