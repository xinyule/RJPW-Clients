# RJPW 自有 CI：跑仓库现存的 lint（ESLint + Prettier 校验）。
# 只手动触发。Rust 侧 lint（lint:rust）不在此工作流内，需要时本地执行。
name: Lint

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint
  cancel-in-progress: false

jobs:
  lint:
    name: Run lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Print environment
        run: |
          node --version
          npm --version

      - name: Install dependencies
        # 仓库 engines 要求 npm ~11（Node 24 自带），lock 文件与 npm 11 同步。
        run: npm ci

      - name: Run lint
        run: npm run lint
