# RJPW 自有 CI：跑 OSS 的 Jest 测试与类型检查。
# 只手动触发；无任何外部覆盖率/结果上传。
name: Testing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testing
  cancel-in-progress: false

jobs:
  test:
    name: Run tests and typechecking
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Print environment
        run: |
          node --version
          npm --version

      - name: Install dependencies
        # 仓库 engines 要求 npm ~11（Node 24 自带），lock 文件与 npm 11 同步。
        run: npm ci

      - name: Run typechecking
        run: npm run test:types

      - name: Run Jest tests
        run: npm test -- --maxWorkers=2
