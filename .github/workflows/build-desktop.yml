# RJPW 自有 CI：构建桌面端未签名包（Windows / macOS / Linux）。
# 只手动触发；不注入任何签名证书：macOS 靠 CSC_IDENTITY_AUTO_DISCOVERY=false 跳过签名，
# Windows 只出 NSIS/Portable（appx 需证书，不在未签名 CI 内），publish 一律 never，
# 绝不把包发布到更新地址。正式签名/公证在本地另行处理。
name: Build Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-desktop
  cancel-in-progress: false

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
          - platform: linux
            os: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Print environment
        run: |
          node --version
          npm --version
          rustc --version

      - name: Install dependencies
        # 仓库 engines 要求 npm ~11（Node 24 自带），lock 文件与 npm 11 同步。
        run: npm ci

      - name: Build native modules (Windows / Linux, host target)
        if: matrix.platform != 'macos'
        working-directory: apps/desktop
        run: npm run build-native

      - name: Build native modules (macOS, cross-platform for universal)
        if: matrix.platform == 'macos'
        working-directory: apps/desktop/desktop_native
        run: node build.js cross-platform --release

      - name: Build app (Windows / Linux)
        if: matrix.platform != 'macos'
        working-directory: apps/desktop
        run: npm run build

      - name: Package Windows (unsigned NSIS + Portable, x64)
        if: matrix.platform == 'windows'
        working-directory: apps/desktop
        run: npx electron-builder --win nsis portable --x64 -p never

      - name: Package Linux (unsigned deb / rpm / AppImage, x64)
        if: matrix.platform == 'linux'
        working-directory: apps/desktop
        run: npx electron-builder --linux deb rpm AppImage --x64 -p never

      - name: Build and package macOS (unsigned, universal)
        if: matrix.platform == 'macos'
        working-directory: apps/desktop
        run: npm run dist:mac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rjpw-desktop-${{ matrix.platform }}
          path: apps/desktop/dist/*
          if-no-files-found: error
